name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command just lint
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  test:
    name: Test (orc/release/threads:on)
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  playwright-e2e:
    name: Playwright e2e (browser drives xterm.js against bridge)
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      # Node and (on Linux) the browsers come from the dev shell, not from
      # actions/setup-node / `playwright install`: both download glibc builds
      # that fail on the NixOS self-hosted runners with "Could not start
      # dynamically linked executable". The dev shell exports
      # PLAYWRIGHT_BROWSERS_PATH (nixpkgs playwright-driver.browsers) and
      # PLAYWRIGHT_NIX_VERSION, and @playwright/test is installed at exactly
      # that version so it looks for the browser revisions the store has.
      # macOS has no nixpkgs browser bundle, so it still downloads Chromium.
      # Build the bridge + echo_packet_app fixture binaries that the
      # Playwright spec spawns as a real subprocess.
      - run: nix develop --command just build
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          nix develop ../.. --command bash -euo pipefail -c '
            if [ -n "${PLAYWRIGHT_NIX_VERSION:-}" ]; then
              npm install --no-audit --no-fund --no-save "@playwright/test@${PLAYWRIGHT_NIX_VERSION}"
            else
              npm install --no-audit --no-fund
              npx playwright install chromium
            fi
          '
      - name: Run Playwright e2e suite
        working-directory: tests/e2e
        run: nix develop ../.. --command npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ join(matrix.runner, '-') }}
          path: tests/e2e/playwright-report/
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ join(matrix.runner, '-') }}
          path: tests/e2e/test-results/
          retention-days: 30

  charter-matrix:
    name: Charter (${{ matrix.mm }}/${{ matrix.mode }}/threads:${{ matrix.threads }})
    strategy:
      fail-fast: false
      matrix:
        mm: [arc, orc, refc]
        mode: [debug, release]
        threads: [on, off]
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command just _matrix ${{ matrix.mm }} ${{ matrix.mode }} ${{ matrix.threads }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charter-${{ matrix.mm }}-${{ matrix.mode }}-${{ matrix.threads }}-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30
